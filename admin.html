<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00897b" />
    <meta name="robots" content="noindex" />
    <title>BooksBrain · Administración</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/pages/catalog.css" />
    <link rel="stylesheet" href="assets/css/pages/dashboard.css" />
    <script type="module" src="assets/js/pages/admin/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Saltar al contenido</a>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Menú de administración">
        <div class="sidebar__brand">
          <a class="brand-logo" href="admin.html#/dashboard">
            <span class="brand-logo__mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
            </span>
            BooksBrain
          </a>
        </div>
        <div class="sidebar__user" id="sidebar-user"></div>
        <nav class="sidebar__nav" id="sidebar-nav"></nav>
        <div class="sidebar__footer">
          <button class="btn btn--light btn--block" type="button" id="logout-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            Cerrar sesión
          </button>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <div class="app-main">
        <header class="topbar">
          <button class="topbar__toggle" type="button" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
          </button>
          <h1 class="topbar__title" id="topbar-title">Panel de control</h1>
          <a class="btn btn--light btn--sm" href="index.html" target="_blank" rel="noopener">Ver tienda</a>
        </header>

        <main class="content" id="content" tabindex="-1">
          <div class="loader-block" role="status"><span class="spinner"></span><span>Verificando sesión…</span></div>
        </main>
      </div>
    </div>
  </body>
</html>
